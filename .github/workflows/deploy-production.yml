# Production deploy (F12-T4, ADR-0014 §3): only by hand, with the typed confirmation and the approval of the GitHub
# Environment `production` (required reviewer: the owner). The CI checks run first; then a D1 Time Travel bookmark is
# recorded, the migrations run, a new version is uploaded and deployed at 100%, and the smoke test runs. On failure the
# log shows the bookmark and the rollback commands (backup-restore §2.1 and §4). Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets of the `production` Environment, which only the owner configures.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy production" to confirm
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Typed confirmation and main only
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "deploy production" || { echo "::error::confirmation text does not match"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::production deploys only from main"; exit 1; }

  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:prod-build

      - name: Record the current version and the D1 bookmark
        run: |
          # The first deploy has nothing to record
          pnpm exec wrangler deployments status --config .output/server/wrangler.json --env production | tee previous-deployment.txt \
            || echo "no previous deployment (first deploy)" | tee previous-deployment.txt
          pnpm exec wrangler d1 time-travel info portfolio-production --env production --config wrangler.jsonc | tee bookmark.txt

      - name: Migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production --config wrangler.jsonc
      - name: Upload a new version
        id: upload
        run: |
          pnpm exec wrangler versions upload --config .output/server/wrangler.json --env production --message "${GITHUB_SHA::12}" | tee upload.txt
          version=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' upload.txt | grep -oE '[0-9a-f-]{36}$')
          test -n "$version" || { echo "::error::no version id in the upload output"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy it at 100%
        run: pnpm exec wrangler versions deploy "${{ steps.upload.outputs.version }}@100%" --config .output/server/wrangler.json --env production --message "${GITHUB_SHA::12}" --yes
      - name: Smoke
        run: node scripts/ops/smoke.ts --base "$SITE_URL"

      - name: How to roll back
        if: ${{ failure() }}
        run: |
          echo "::error::the deploy or the smoke failed. The state before it:"
          cat previous-deployment.txt bookmark.txt 2>/dev/null || true
          echo "Code:   pnpm exec wrangler rollback --env production   (or versions deploy <previous>@100%)"
          echo "Schema: wrangler d1 time-travel restore portfolio-production --bookmark=<bookmark above> (destructive; backup-restore §2.1)"

      - name: Keep the deploy record
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-deploy-${{ github.run_id }}
          path: |
            previous-deployment.txt
            bookmark.txt
          retention-days: 90
          if-no-files-found: warn
